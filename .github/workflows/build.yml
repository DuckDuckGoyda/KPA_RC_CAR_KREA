name: Tests and Windows exe

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build exe
        run: |
          python packaging/make_icon.py
          pyinstaller --noconfirm packaging/rc_controller.spec

      - name: Smoke-test the exe
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\RC_Controller.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content dist\logs\errors.log -ErrorAction SilentlyContinue; exit 1 }
          Write-Host "exe started, loaded its profile and help, exited cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: RC_Controller
          path: dist/RC_Controller.exe
          if-no-files-found: error
