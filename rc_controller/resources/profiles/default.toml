# ============================================================================
#  Профиль протокола машинки
# ============================================================================
#  Здесь описано всё, что зависит от прошивки: команды, их коды и параметры,
#  формат пакета, что отправлять при движении, клавиши и геймпад.
#  Код программы менять не нужно: поправьте этот файл и нажмите
#  «Профиль → Перезагрузить» (Ctrl+R).
#
#  Числа можно писать в десятичном (10) или шестнадцатеричном (0x0A) виде.
#  Всё после знака # — комментарий.
#
#  Протокол v1.0, команды машинки М43.
# ============================================================================

[profile]
name = "Трахтор"
description = "Команды М43, протокол v1.0"


# ---------------------------------------------------------------------------
#  Связь
# ---------------------------------------------------------------------------
[link]
baudrate = 19200            # скорость UART: 19200 бит/с, 8N1
wait_for_reply = true       # ждать ответный пакет на каждую команду
                            # (false — отправлять и не ждать, пока прошивка не отвечает)
reply_timeout_ms = 200      # машинка отвечает за 50 мс, запас — на задержку Bluetooth;
                            # реальное время покажет эхо-тест
retries = 3                 # повторы команды без ответа
retry_interval_ms = 1000    # интервал между повторами
lost_after_failures = 3     # сколько обменов подряд без ответа = «связь потеряна»
keepalive_command = "GET_TEL"   # периодический запрос (не реже 1 раза в секунду);
                                # "" — ничего не отправлять
keepalive_period_ms = 1000
keepalive_enabled = false   # начальное состояние галочки «Опрос связи»
frame_timeout_ms = 100      # недополученный пакет сбрасывается через это время


# ---------------------------------------------------------------------------
#  Формат пакета:  0xAC 0x53 | LEN | SQN | ADDR | CODE PARAM... | CRC
# ---------------------------------------------------------------------------
[packet]
sync = [0xAC, 0x53]         # синхрослово
address = 1                 # ADDR, у всех устройств 1
sqn_modulo = 255            # SQN считается по модулю 255: 0, 1, … 254, 0, …
byte_order = "little"       # порядок байт многобайтовых чисел: "little" (младший первым) или "big"
crc = "CRC-8/MAXIM-DOW"     # полином 0x31 (x^8+x^5+x^4+1), init 0x00, с отражением.
                            # Эталон для прошивки: docs/protocol/crc8.c
# Другие варианты: "CRC-8/0x31", "CRC-8/NRSC-5", "CRC-8/SMBUS" или свой:
# crc = { poly = 0x31, init = 0x00, refin = true, refout = true, xorout = 0x00 }


# ---------------------------------------------------------------------------
#  Коды подтверждения (поле ACK ответного пакета)
# ---------------------------------------------------------------------------
[acks]
0 = "команда принята"
1 = "неверный адрес"
2 = "ошибка CRC"
3 = "недопустимый параметр"


# ---------------------------------------------------------------------------
#  Команды
# ---------------------------------------------------------------------------
#  name        — имя для терминала, макросов и шаблонов (латиница, цифры, _)
#  code        — байт CODE
#  params      — параметры по порядку; type: int8, uint8, int16, uint16, int32, uint32;
#                min/max необязательны (по умолчанию — весь диапазон типа)
#  reply       — как разбирать поле DATA ответа (необязательно)
#  description — описание для справки
#
#  Новая команда = новый блок [[command]]. Пример:
#
#  [[command]]
#  name = "HORN"
#  code = 0x10
#  params = [{ name = "ms", type = "uint16", description = "длительность, мс" }]
#  description = "Посигналить"

[[command]]
name = "SET_SPEED"
code = 0x01
params = [{ name = "speed", type = "int8", min = -127, max = 127, description = "скорость: + вперёд, − назад" }]
description = "Установка скорости"

[[command]]
name = "SET_ANGLE"
code = 0x02
params = [{ name = "angle", type = "int8", min = -127, max = 127, description = "угол поворота: + вправо, − влево" }]
description = "Установка угла поворота"

[[command]]
name = "SS_SA"
code = 0x03
params = [
    { name = "speed", type = "int8", min = -127, max = 127 },
    { name = "angle", type = "int8", min = -127, max = 127 },
]
description = "Скорость и угол одной командой"

[[command]]
name = "GET_TEL"
code = 0x04
description = "Запрос телеметрии"
# Раскладка телеметрии. Значения выводятся «как есть».
reply = [
    { name = "TLM_NUM", type = "uint8", description = "номер телеметрии" },
    { name = "SPEED", type = "int16", description = "скорость (акселерометр)" },
    { name = "PITCH", type = "int16", description = "крен" },
    { name = "ROLL", type = "int16", description = "тангаж" },
    { name = "RPM_MAG", type = "int16", description = "обороты, магнитный тахометр" },
    { name = "RPM_OPT", type = "int16", description = "обороты, оптический тахометр" },
    { name = "DIST", type = "uint16", description = "расстояние до препятствия" },
    { name = "BAT_LVL", type = "uint8", description = "заряд батареи" },
    { name = "VALID", type = "uint8", description = "маска достоверности" },
]

[[command]]
name = "SS_SA_GT"
code = 0x07
params = [
    { name = "speed", type = "int8", min = -127, max = 127 },
    { name = "angle", type = "int8", min = -127, max = 127 },
]
description = "Скорость и угол + запрос телеметрии"

[[command]]
name = "LED"
code = 0xFE
params = [{ name = "state", type = "uint8", min = 0, max = 1, description = "0 — включить, 1 — выключить" }]
description = "Управление светодиодами"

[[command]]
name = "VERSION"
code = 0xFF
params = [{ name = "module", type = "uint8", description = "0 — проект, 1 — акселерометр, 2 — тахометры, 3 — батарея, 4 — дальномер, 5 — мотор, 6 — привод поворота, 7 — WiFi, 8 — Bluetooth" }]
description = "Запрос версии"
reply = [
    { name = "PRODUCT", type = "uint8", description = "изделие: 1 — М41, 2 — Ч4П2У, 3 — М43" },
    { name = "SW", type = "uint8", description = "версия ПО" },
]


# ---------------------------------------------------------------------------
#  Движение (клавиатура, геймпад, макросы)
# ---------------------------------------------------------------------------
[drive]
# speed_angle  — скорость + угол поворота колёс (серво);
# differential — левый и правый борт отдельно (танковая схема).
mode = "speed_angle"

# Что отправлять при движении. Переменные: {speed} {angle} — для speed_angle,
# {left} {right} — для differential. Можно несколько команд списком:
# command = ["SET_SPEED {speed}", "SET_ANGLE {angle}"]
command = ["SS_SA {speed} {angle}"]
stop = ["SS_SA 0 0"]        # аварийная остановка (Пробел / Esc / кнопка «СТОП»)
brake = ["SS_SA 0 0"]       # шаг макроса «тормоз»; пока нет механики — то же, что стоп

max_speed = 127             # значение {speed} при 100 % газа
max_angle = 127             # значение {angle} при полном повороте
invert_speed = false        # поменять «вперёд» и «назад»
invert_angle = false        # поменять «влево» и «вправо»
resend_ms = 200             # пока машинка едет, команда повторяется с этим периодом
min_interval_ms = 100       # команда движения уходит не чаще этого (мс), чтобы не заваливать
                            # Bluetooth пакетами при разгоне; остановка отправляется сразу

# Плавность для клавиатуры и геймпада (доля от максимума в секунду; 2.0 = от 0 до 100 % за 0,5 с).
# Ползунки «Чувствительность» в программе умножают эти значения.
accel = 2.0                 # разгон
decel = 3.0                 # сброс газа при отпускании клавиши
steer_rate = 5.0            # поворот колёс
center_rate = 8.0           # возврат колёс в центр


# ---------------------------------------------------------------------------
#  Клавиши (раскладка не важна: W работает и как Ц)
# ---------------------------------------------------------------------------
[keys]
forward = "W"
backward = "S"
left = "A"
right = "D"
stop = "Space"              # Esc — аварийная остановка всегда, даже при вводе текста


# ---------------------------------------------------------------------------
#  Геймпад (Xbox-совместимый, XInput)
# ---------------------------------------------------------------------------
[gamepad]
enabled = true
throttle = "auto"           # auto — курки (RT вперёд, LT назад) и вертикаль левого стика;
                            # triggers — только курки; left_stick / right_stick — только вертикаль стика
steering = "left_stick"     # left_stick / right_stick — горизонталь стика
deadzone = 0.15             # мёртвая зона стиков и курков (0…1)
stop_button = "B"           # аварийная остановка: A, B, X, Y, LB, RB, BACK, START
